# Builds the test APK (client bound to qa.door43.org) on GitHub, so testing on a phone needs no
# Android toolchain on anyone's computer. The signed APK is attached to the run as an artifact.
# It is signed with a key made for this run only: to install a newer build, uninstall the old one.
name: Android QA APK

on:
  pull_request:
  # A run on main saves its caches where every pull request can restore them; a cache saved
  # by a pull request is only visible to later runs of that same pull request.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-qa-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.0.12077973
  OPENSSL_VERSION: openssl-3.5.7

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            shell/package-lock.json

      - name: Build the QA client into the shell
        run: |
          npm ci
          node scripts/build-client-into-shell.mjs --qa

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          # Its default list includes `tools`, which the SDK repository no longer serves.
          packages: platform-tools

      # The NDK is a large download that once arrived corrupt, so it is cached. The platform and
      # build tools are not: the runner image ships them owned by root, and restoring over them
      # makes the whole restore fail. sdkmanager downloads them only if the image lacks them.
      - name: Cache the Android NDK
        id: android-ndk
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
          key: android-ndk-${{ runner.os }}-${{ env.NDK_VERSION }}

      - name: Install the Android platform, build tools and NDK
        env:
          NDK_CACHED: ${{ steps.android-ndk.outputs.cache-hit }}
        run: |
          packages=("platforms;android-34" "build-tools;34.0.0")
          if [ "$NDK_CACHED" != "true" ]; then packages+=("ndk;${NDK_VERSION}"); fi
          sdkmanager "${packages[@]}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell/src-tauri

      - name: Cache OpenSSL for Android
        id: openssl
        uses: actions/cache@v6
        with:
          path: shell/src-tauri/src/openssl/libs
          key: openssl-android-arm64-${{ env.OPENSSL_VERSION }}-ndk-${{ env.NDK_VERSION }}

      - name: Build OpenSSL for Android (arm64)
        if: steps.openssl.outputs.cache-hit != 'true'
        working-directory: shell/src-tauri/src/openssl
        run: ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" bash make_openssl.bsh android-arm64

      - name: Generate the Android project
        working-directory: shell
        run: |
          npm ci
          export NDK_HOME="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          npm run android:tauri -- android init --ci
          node ../scripts/prepare-android.mjs

      - name: Build the release APK (arm64)
        working-directory: shell
        run: |
          export NDK_HOME="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          npm run android:tauri -- android build --apk --target aarch64 --ci

      - name: Sign the APK with a key for this run
        working-directory: shell
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' -type f | head -n 1)
          if [ -z "$apk" ]; then echo "no unsigned release APK was built"; exit 1; fi
          pass=$(openssl rand -hex 16)
          keytool -genkeypair -keystore run.keystore -alias run -keyalg RSA -keysize 2048 -validity 30 \
            -storepass "$pass" -keypass "$pass" -dname "CN=tC Check QA test build"
          tools="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          "$tools/zipalign" -f -p 4 "$apk" aligned.apk
          mkdir -p apk
          "$tools/apksigner" sign --ks run.keystore --ks-key-alias run --ks-pass "pass:$pass" \
            --out "apk/tc-check-qa-${GITHUB_SHA::7}.apk" aligned.apk
          "$tools/apksigner" verify "apk/tc-check-qa-${GITHUB_SHA::7}.apk"
          rm -f run.keystore aligned.apk
          ls -lh apk

      - uses: actions/upload-artifact@v7
        with:
          name: tc-check-qa-apk
          path: shell/apk/*.apk
          if-no-files-found: error
          retention-days: 14
