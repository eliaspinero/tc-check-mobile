[package]
name = "tc-check"
version = "0.1.0"
description = "translationCore checking on a phone"
authors = ["Elias Piñero"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tc_check_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true # Enables link-time-optimizations.
opt-level = "s" # Prioritizes small binary size. Use `3` if you prefer speed.
# No panic = "abort": a panic in a request (pankosmia-web unwraps) must end that request with a 500,
# not close the app (#54).
strip = true # Ensures debug symbols are removed.

[dependencies]
tauri = { version = "2", features = [] }
pankosmia_web = "=0.18.15"
git2 = "0.21.0"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1.43.0"
rocket = { version = "0.5.1", features = ["json"] }
thiserror = "2"
# The Rust translationCore 4's store, which records the decisions (src/tc.rs, #48). The rig pins the same.
tc-journal = { git = "https://github.com/unfoldingWord/translationCore4", rev = "c0d6e0e8e5028dc977c77c5e8b2109d580cfda60" }
tc-store = { git = "https://github.com/unfoldingWord/translationCore4", rev = "c0d6e0e8e5028dc977c77c5e8b2109d580cfda60" }
tc-door43 = { git = "https://github.com/unfoldingWord/translationCore4", rev = "c0d6e0e8e5028dc977c77c5e8b2109d580cfda60" }
tc-sync = { git = "https://github.com/unfoldingWord/translationCore4", rev = "c0d6e0e8e5028dc977c77c5e8b2109d580cfda60" }
tauri-plugin-fs = "2"
include_dir = "0.7"
tauri-plugin-http = "2"
tauri-plugin-log = "2"
reqwest = { version = "0.13.4", features = ["json"] }


# machine-uid 0.6.0 has no Android branch (vendor/machine-uid/PROVENANCE.md).
[patch.crates-io]
machine-uid = { path = "../../vendor/machine-uid" }
